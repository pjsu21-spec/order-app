<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다름달음 공유폴더</title>
<meta property="og:title" content="다름달음 공유폴더">
<meta property="og:description" content="다름달음 사내 공유폴더">
<meta name="robots" content="noindex">
<style>
  :root{
    --ink:#2a2426; --paper:#fbf8f6; --line:#e2d8d4; --accent:#d9485b;
    --accent-soft:#fbe9ec; --warn:#a8322a; --warn-soft:#fbeae5; --muted:#8c8280;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--paper); color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:15px; }
  button{ font-family:inherit; font-size:14px; cursor:pointer; border-radius:8px; border:1px solid var(--line);
    background:#fff; color:var(--ink); padding:9px 14px; }
  button:disabled{ opacity:.5; cursor:default; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .btn-danger{ color:var(--warn); border-color:var(--warn); }
  input[type=text],input[type=password],input[type=search]{ font-family:inherit; font-size:16px; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; width:100%; background:#fff; color:var(--ink); }

  /* 로그인 */
  #login-screen{ display:none; min-height:100vh; align-items:center; justify-content:center; padding:16px; }
  .login-card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:28px 22px; width:100%; max-width:340px; }
  .login-card h1{ font-size:19px; margin:0 0 4px; }
  .login-card .sub{ color:var(--muted); font-size:13px; margin-bottom:18px; }
  .login-card input{ margin-bottom:10px; }
  .login-card button{ width:100%; padding:12px; }
  #login-error{ display:none; color:var(--warn); background:var(--warn-soft); border-radius:8px; padding:9px 11px; font-size:13px; margin-bottom:10px; }

  /* 본문 */
  #app{ display:none; max-width:920px; margin:0 auto; padding:14px 16px 90px; }
  header{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  header h1{ font-size:18px; margin:0; flex:1; letter-spacing:-0.02em; }
  .back-link{ font-size:12.5px; font-weight:600; color:var(--accent); text-decoration:none; white-space:nowrap; padding:6px 10px; border:1px solid var(--accent); border-radius:8px; background:#fff; }
  #user-badge{ font-size:12px; color:var(--muted); white-space:nowrap; }
  header button{ padding:6px 10px; font-size:12.5px; }

  .usage{ font-size:12px; color:var(--muted); margin-bottom:12px; }
  .usage-bar{ height:6px; background:#ece7d9; border-radius:3px; overflow:hidden; margin-top:4px; }
  .usage-bar > div{ height:100%; background:var(--accent); width:0; }
  .usage-bar.full > div{ background:var(--warn); }

  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .toolbar input[type=search]{ flex:1 1 160px; min-width:0; padding:9px 12px; font-size:15px; }

  .crumbs{ display:flex; flex-wrap:wrap; align-items:center; gap:2px; font-size:14px; margin-bottom:8px; }
  .crumbs button{ border:none; background:none; padding:5px 6px; color:var(--accent); font-weight:600; }
  .crumbs button.current{ color:var(--ink); cursor:default; }
  .crumbs span{ color:var(--muted); }

  .list{ background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .item{ display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid #eee9dc; }
  .item:last-child{ border-bottom:none; }
  .item .icon{ font-size:22px; width:28px; text-align:center; flex:none; }
  .item .main{ flex:1; min-width:0; cursor:pointer; }
  .item .name{ font-weight:600; word-break:break-all; line-height:1.35; }
  .item .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .item .more{ flex:none; border:none; background:none; font-size:20px; padding:6px 10px; color:var(--muted); }
  .empty{ padding:38px 16px; text-align:center; color:var(--muted); font-size:14px; }
  #drop-hint{ display:none; position:fixed; inset:0; background:rgba(217,72,91,.12); border:3px dashed var(--accent);
    align-items:center; justify-content:center; font-size:20px; font-weight:700; color:var(--accent); z-index:40; pointer-events:none; }
  body.dragging #drop-hint{ display:flex; }

  /* 업로드 진행 */
  #uploads{ position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
    padding:10px 16px; display:none; z-index:30; max-height:40vh; overflow:auto; }
  .up-row{ font-size:13px; margin-bottom:8px; }
  .up-row .up-name{ display:flex; justify-content:space-between; gap:8px; }
  .up-row .up-name span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .up-row .bar{ height:5px; background:#ece7d9; border-radius:3px; overflow:hidden; margin-top:4px; }
  .up-row .bar > div{ height:100%; background:var(--accent); width:0; transition:width .2s; }
  .up-row.error .bar > div{ background:var(--warn); }
  .up-row.error .up-state{ color:var(--warn); }

  /* 여러 개 선택 */
  .sel-bar{ display:none; position:sticky; top:0; z-index:20; background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px;
    padding:8px 10px; margin-bottom:10px; gap:6px; flex-wrap:wrap; align-items:center; }
  body.selecting .sel-bar{ display:flex; }
  .sel-bar .cnt{ font-weight:700; font-size:14px; margin-right:auto; }
  .sel-bar button{ padding:7px 11px; font-size:13px; }
  .item .chk{ flex:none; width:20px; height:20px; accent-color:var(--accent); cursor:pointer; }
  .item.picked{ background:var(--accent-soft); }
  body.selecting .item .main{ user-select:none; }

  /* 휴지통 */
  .trash-list{ max-height:52vh; overflow:auto; }
  .trash-row{ display:flex; align-items:center; gap:8px; padding:10px 4px; border-bottom:1px solid #eee9dc; flex-wrap:wrap; }
  .trash-row .icon{ font-size:20px; width:26px; text-align:center; flex:none; }
  .trash-row .main{ flex:1 1 150px; min-width:0; }
  .trash-row .name{ font-weight:600; word-break:break-all; line-height:1.35; }
  .trash-row .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .trash-row .acts{ display:flex; gap:6px; margin-left:auto; }
  .trash-row .acts button{ padding:6px 10px; font-size:13px; }

  /* 메뉴 / 대화상자 */
  .overlay{ position:fixed; inset:0; background:rgba(42,36,38,.4); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .overlay.show{ display:flex; }
  .sheet{ background:#fff; width:100%; max-width:480px; border-radius:14px 14px 0 0; padding:14px 14px 20px; }
  .sheet h3{ font-size:15px; margin:4px 4px 10px; word-break:break-all; }
  .sheet .sheet-btn{ display:block; width:100%; text-align:left; border:none; padding:13px 10px; font-size:15px; border-radius:8px; }
  .sheet .sheet-btn:hover{ background:var(--accent-soft); }
  .sheet .sheet-btn.danger{ color:var(--warn); }
  .sheet .row{ display:flex; gap:8px; margin-top:12px; }
  .sheet .row button{ flex:1; padding:11px; }
  .sheet p{ margin:4px 4px 0; font-size:14px; line-height:1.5; }
  @media (min-width:640px){ .overlay{ align-items:center; } .sheet{ border-radius:14px; } }

  .toast{ position:fixed; left:50%; top:16px; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 16px; border-radius:20px; font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:60; max-width:90vw; }
  .toast.show{ opacity:1; }

  /* ── 브랜드 디자인 (통합 시스템 홈과 같은 빨간 머리글) ── */
  html, body{ background:#fdf3ec; }
  body{ background:linear-gradient(180deg, #fcefe4 0, #fef6f1 420px) #fef6f1; }
  header{ background:linear-gradient(100deg, #c50f2c 0%, #e01f2e 55%, #ec3437 100%); color:#fff; padding:10px 16px; border-radius:16px; box-shadow:0 8px 22px rgba(197,15,44,.2); flex-wrap:wrap; row-gap:8px; }
  header h1{ color:#fff; display:flex; align-items:center; gap:8px; font-size:17px; min-width:0; }
  header .hd-logo{ height:30px; width:auto; display:block; flex:0 0 auto; }
  header .hd-sep{ width:1px; align-self:stretch; min-height:24px; background:rgba(255,255,255,.5); }
  header .back-link{ background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:999px; }
  header #user-badge{ color:#fff; opacity:.92; }
  header button{ background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:999px; }
  header button:hover, header .back-link:hover{ background:rgba(255,255,255,.28); }
  .login-card{ border:none !important; border-radius:20px !important; box-shadow:0 16px 44px rgba(150,40,40,.14); text-align:center; }
  .login-card .lg-logo{ display:block; height:56px; width:auto; margin:4px auto 10px; }
  .login-card h1{ display:flex; align-items:center; justify-content:center; gap:6px; }
  @media (max-width:520px){ header .hd-sep{ display:none; } header .hd-logo{ height:24px; } }
</style>
<script src="assets/icons.js"></script>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <a class="back-link" href="index.html" style="display:inline-block;margin-bottom:6px;">← 통합 시스템</a>
    <img class="lg-logo" src="assets/logo-red.png" alt="다름달음">
    <h1>📁 다름달음 공유폴더</h1>
    <div class="sub">발주 프로그램과 같은 아이디로 로그인합니다</div>
    <div id="login-error"></div>
    <input type="text" id="login-username" placeholder="아이디" autocomplete="username" autocapitalize="off">
    <input type="password" id="login-password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn-primary" id="login-btn">로그인</button>
  </div>
</div>

<div id="app">
  <header>
    <a class="back-link" href="index.html">← 통합 시스템</a>
    <img class="hd-logo" src="assets/logo-white.png" alt="다름달음"><span class="hd-sep"></span>
    <h1>📁 공유폴더</h1>
    <span id="user-badge"></span>
    <button id="logout-btn">로그아웃</button>
  </header>

  <div class="usage">
    <span id="usage-text">사용량 확인 중…</span>
    <div class="usage-bar" id="usage-bar"><div></div></div>
  </div>

  <div class="toolbar">
    <button class="btn-primary" id="upload-btn">⬆ 파일 올리기</button>
    <button id="folder-btn">＋ 새 폴더</button>
    <button id="select-btn">☑ 선택</button>
    <button id="trash-btn" style="display:none;">🗑 휴지통</button>
    <input type="search" id="search" placeholder="전체에서 이름 검색">
    <input type="file" id="file-input" multiple style="display:none;">
  </div>

  <div class="sel-bar" id="sel-bar">
    <span class="cnt" id="sel-count">0개 선택</span>
    <button id="sel-all">전체선택</button>
    <button id="sel-dl">⬇ 내려받기</button>
    <button id="sel-move">📂 이동</button>
    <button class="btn-danger" id="sel-del">🗑 삭제</button>
    <button id="sel-done">완료</button>
  </div>

  <div class="crumbs" id="crumbs"></div>
  <div class="list" id="list"><div class="empty">불러오는 중…</div></div>
</div>

<div id="drop-hint">여기에 놓으면 올라갑니다</div>
<div id="uploads"></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════
// 설정 — Cloudflare Worker 주소만 본인 것으로 바꿔주세요 (끝에 / 없이)
// ══════════════════════════════════════════════════════════════════
const WORKER_URL = 'https://dareum-files.dareumdaleum.workers.dev';

// 발주 프로그램과 같은 Supabase 프로젝트 (로그인용)
const SB_URL = 'https://rsgbqlrxtexknhsvkroc.supabase.co';
const SB_KEY = 'sb_publishable_Es6Y1pOe1friYzEnvT0iSw_gqQQvFvJ';
const sbHeaders = { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type': 'application/json' };

const SINGLE_MAX = 50 * 1024 * 1024;   // 이보다 크면 분할 업로드
const PART_SIZE  = 20 * 1024 * 1024;   // 분할 크기

let token = null;
let me = null;
let items = [];          // 전체 파일/폴더 목록
let byId = new Map();
let currentFolder = null; // null = 최상위
let searchText = '';
let selectMode = false;  // 여러 개 선택 모드
const selected = new Set(); // 선택한 항목 id
let visibleRows = [];     // 지금 화면에 보이는 항목 (전체선택·Shift 범위선택용)
let lastPickIdx = -1;
let trashEnabled = false, trashDays = 30, trashCount = 0; // 휴지통(Worker가 지원할 때만 켜짐)
let aclEnabled = false, rootLvl = null; // 폴더별 접근 권한 (Worker·SQL이 지원할 때만)
// 폴더 '안'에서 내 권한: 'edit' 전체 / 'read' 읽기만 (Worker가 항목마다 lvl을 붙여 줌. 예전 Worker면 공유폴더 권한 그대로)
function lvlIn(folderId){
  if (folderId) { const f = byId.get(folderId); if (f && f.lvl) return f.lvl; }
  else if (rootLvl) return rootLvl;
  return me && me.readOnly ? 'read' : 'edit';
}
const canEditIn = (folderId) => lvlIn(folderId) === 'edit';

const $ = (id) => document.getElementById(id);
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), 2800); }
function fmtSize(n){
  n = Number(n||0);
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  if (n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + ' MB';
  return (n/1024/1024/1024).toFixed(2) + ' GB';
}
function fmtDate(s){ const d = new Date(s); return isNaN(d) ? '' : d.toLocaleDateString('ko-KR', { year:'2-digit', month:'numeric', day:'numeric' }); }
function iconFor(it){
  if (it.is_folder) return '📁';
  const m = (it.mime||'').toLowerCase(), n = it.name.toLowerCase();
  if (m.startsWith('image/')) return '🖼';
  if (m.startsWith('video/')) return '🎬';
  if (m.startsWith('audio/')) return '🎵';
  if (m === 'application/pdf') return '📕';
  if (/\.(xlsx?|csv)$/.test(n)) return '📊';
  if (/\.(docx?|hwpx?|txt)$/.test(n)) return '📝';
  if (/\.(pptx?)$/.test(n)) return '📙';
  if (/\.(zip|7z|rar|egg|alz)$/.test(n)) return '🗜';
  return '📄';
}
function canPreview(it){
  const m = (it.mime||'').toLowerCase();
  return (m.startsWith('image/') && m !== 'image/svg+xml') || m.startsWith('video/') || m.startsWith('audio/') || m === 'application/pdf';
}

// ── 서버 호출 ──
async function api(path, options = {}) {
  let res;
  try {
    res = await fetch(WORKER_URL + path, {
      ...options,
      headers: { 'Authorization': `Bearer ${token}`, ...(options.body && typeof options.body === 'string' ? { 'Content-Type':'application/json' } : {}), ...(options.headers||{}) }
    });
  } catch (e) { throw new Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인해주세요.'); }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { handleLoggedOut(); throw new Error(data.error || '로그인이 필요합니다'); }
  if (!res.ok) { const err = new Error(data.error || `오류 (${res.status})`); err.status = res.status; throw err; }
  return data;
}
function dlUrl(it, inline){ return `${WORKER_URL}/dl/${it.id}?t=${encodeURIComponent(token)}${inline ? '&inline=1' : ''}`; }

// ── 로그인 (발주 프로그램과 동일한 방식 · 같은 세션 공유) ──
async function hashPassword(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
// 로그인·로그아웃은 DB 함수(RPC)로 처리하고, 함수가 아직 없으면(404) 예전 방식으로 동작합니다 (전환 기간 호환용).
async function sbRpc(name, args){
  const res = await fetch(`${SB_URL}/rest/v1/rpc/${name}`, { method:'POST', headers:{ 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}`, 'Content-Type':'application/json' }, body: JSON.stringify(args || {}) });
  if (res.status === 404){ const e = new Error('rpc-missing'); e.rpcMissing = true; throw e; }
  if (!res.ok) throw new Error('로그인 서버 오류입니다. 잠시 후 다시 시도해주세요.');
  return res.json();
}async function login(username, password) {
  const hash = await hashPassword(password);
  try {
    const r = await sbRpc('app_login', { p_username: username, p_hash: hash });
    if (r && r.error === 'locked') throw new Error('로그인 시도가 너무 많습니다. 10분 뒤에 다시 시도해주세요');
    if (!r || r.error || !r.token) throw new Error('아이디 또는 비밀번호가 올바르지 않습니다');
    localStorage.setItem('auth_token', r.token);
    return r.token;
  } catch (e) { if (!e.rpcMissing) throw e; }
  // (호환) 예전 방식
  const res = await fetch(`${SB_URL}/rest/v1/users?username=eq.${encodeURIComponent(username)}&is_active=eq.true&limit=1`, { headers: sbHeaders });
  if (!res.ok) throw new Error('로그인 서버 오류입니다. 잠시 후 다시 시도해주세요.');
  const rows = await res.json();
  if (!rows.length || rows[0].password_hash !== hash) throw new Error('아이디 또는 비밀번호가 올바르지 않습니다');
  const ins = await fetch(`${SB_URL}/rest/v1/sessions`, {
    method:'POST', headers:{ ...sbHeaders, 'Prefer':'return=representation' }, body: JSON.stringify({ user_id: rows[0].id })
  });
  if (!ins.ok) throw new Error('세션 생성에 실패했습니다. 잠시 후 다시 시도해주세요.');
  const inserted = await ins.json();
  const t = Array.isArray(inserted) ? inserted[0]?.token : inserted?.token;
  if (!t) throw new Error('세션 생성에 실패했습니다. 잠시 후 다시 시도해주세요.');
  localStorage.setItem('auth_token', t);
  return t;
}
function showLogin(msg){
  $('app').style.display = 'none';
  $('login-screen').style.display = 'flex';
  const err = $('login-error');
  if (msg) { err.textContent = msg; err.style.display = 'block'; } else { err.style.display = 'none'; }
  const btn = $('login-btn'); btn.disabled = false; btn.textContent = '로그인';
}
function handleLoggedOut(){ token = null; try { localStorage.removeItem('auth_token'); } catch(e){} showLogin('로그인이 만료되었습니다. 다시 로그인해주세요.'); }

async function doLogin(){
  const u = $('login-username').value.trim(), p = $('login-password').value;
  if (!u || !p) { showLogin('아이디와 비밀번호를 입력해주세요'); return; }
  const btn = $('login-btn'); btn.disabled = true; btn.textContent = '로그인 중...';
  try { token = await login(u, p); await start(); }
  catch (e) { if ($('login-screen').style.display !== 'none') showLogin(e.message); }
}
$('login-btn').addEventListener('click', doLogin);
$('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('logout-btn').addEventListener('click', async () => {
  try { await sbRpc('app_logout', { p_token: token }); }
  catch(e){ if (e.rpcMissing) { try { await fetch(`${SB_URL}/rest/v1/sessions?token=eq.${encodeURIComponent(token)}`, { method:'DELETE', headers: sbHeaders }); } catch(e2){} } }
  token = null; try { localStorage.removeItem('auth_token'); } catch(e){}
  showLogin();
});

// ── 목록 ──
async function refresh(){
  const data = await api('/api/list');
  items = data.items; me = data.me;
  byId = new Map(items.map(it => [it.id, it]));
  [...selected].forEach(id => { if (!byId.has(id)) selected.delete(id); });
  if (currentFolder && !byId.has(currentFolder)) currentFolder = null;
  $('user-badge').textContent = `${me.display_name}${me.isAdmin ? ' (관리자)' : me.readOnly ? ' (읽기 전용)' : ''}`;
  aclEnabled = !!data.aclEnabled; rootLvl = data.rootLvl || null;
  const pct = Math.min(100, data.used / data.limit * 100);
  $('usage-text').textContent = `사용량 ${fmtSize(data.used)} / ${fmtSize(data.limit)} (${pct.toFixed(1)}%)${data.trash && data.trash.bytes ? ` · 휴지통 ${fmtSize(data.trash.bytes)} 포함` : ''}`;
  trashEnabled = !!data.trashEnabled; trashDays = data.trashDays || 30; trashCount = (data.trash && data.trash.count) || 0;
  $('trash-btn').style.display = trashEnabled && !me.readOnly ? '' : 'none';
  $('trash-btn').textContent = `🗑 휴지통${trashCount ? ` (${trashCount})` : ''}`;
  $('usage-bar').firstElementChild.style.width = pct + '%';
  $('usage-bar').classList.toggle('full', pct >= 90);
  render();
}

function pathOf(id){
  const out = []; let cur = id ? byId.get(id) : null; let guard = 0;
  while (cur && guard++ < 100) { out.unshift(cur); cur = cur.parent_id ? byId.get(cur.parent_id) : null; }
  return out;
}

function render(){
  // 경로
  const crumbs = $('crumbs'); crumbs.innerHTML = '';
  const addCrumb = (label, id, isCurrent) => {
    const b = document.createElement('button'); b.textContent = label;
    if (isCurrent) b.className = 'current'; else b.addEventListener('click', () => { currentFolder = id; clearSearch(); render(); });
    crumbs.appendChild(b);
  };
  const path = pathOf(currentFolder);
  addCrumb('전체', null, path.length === 0);
  path.forEach((f, i) => { const s = document.createElement('span'); s.textContent = '›'; crumbs.appendChild(s); addCrumb(f.name, f.id, i === path.length - 1); });
  // 이 폴더에서 올리기·새 폴더 (읽기만이면 숨김) + 권한 안내
  const editHere = canEditIn(currentFolder);
  $('upload-btn').style.display = editHere ? '' : 'none';
  $('folder-btn').style.display = editHere ? '' : 'none';
  const lockedAt = path.filter(f => f.restricted);
  if (lockedAt.length || !editHere) {
    const n = document.createElement('span');
    n.style.cssText = 'margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;';
    n.textContent = `${lockedAt.length ? '🔒 지정한 부서·직원만 보는 폴더' : ''}${lockedAt.length && !editHere ? ' · ' : ''}${!editHere ? '읽기만 가능' : ''}`;
    if (me && me.isAdmin && lockedAt.length) n.textContent += ` (${lockedAt.map(f => f.name).join(' › ')}에서 지정)`;
    crumbs.appendChild(n);
  }

  // 항목
  const q = searchText.trim().toLowerCase();
  let rows = q ? items.filter(it => it.name.toLowerCase().includes(q))
               : items.filter(it => (it.parent_id || null) === currentFolder);
  rows.sort((a, b) => (b.is_folder - a.is_folder) || a.name.localeCompare(b.name, 'ko'));
  visibleRows = rows; updateSelBar();
  const list = $('list'); list.innerHTML = '';
  if (!rows.length) {
    list.innerHTML = `<div class="empty">${q ? '검색 결과가 없습니다.' : (me && me.readOnly ? '비어 있는 폴더입니다.' : '비어 있는 폴더입니다.<br>「파일 올리기」로 파일을 추가해보세요.')}</div>`;
    return;
  }
  for (const [idx, it] of rows.entries()) {
    const row = document.createElement('div'); row.className = 'item' + (selected.has(it.id) ? ' picked' : '');
    const where = q ? (pathOf(it.parent_id).map(f => f.name).join(' › ') || '전체') + ' · ' : '';
    const meta = it.is_folder
      ? `${where}폴더 · ${items.filter(x => x.parent_id === it.id).length}개${it.restricted ? ' · 🔒 지정한 부서·직원만' : ''}${it.lvl === 'read' && !(me && me.readOnly) ? ' · 읽기만' : ''}`
      : `${where}${fmtSize(it.size)} · ${fmtDate(it.created_at)} · ${escapeHtml(it.uploaded_by_name || '')}`;
    row.innerHTML = `${selectMode ? `<input type="checkbox" class="chk" ${selected.has(it.id) ? 'checked' : ''}>` : ''}<div class="icon">${iconFor(it)}</div>
      <div class="main"><div class="name">${it.restricted ? '🔒 ' : ''}${escapeHtml(it.name)}</div><div class="meta">${it.is_folder ? escapeHtml(meta) : meta}</div></div>
      <button class="more" aria-label="메뉴">⋮</button>`;
    row.querySelector('.main').addEventListener('click', e => { if (selectMode) pickItem(it, idx, e.shiftKey); else openItem(it); });
    const chk = row.querySelector('.chk'); if (chk) chk.addEventListener('click', e => { e.preventDefault(); pickItem(it, idx, e.shiftKey); });
    row.querySelector('.more').addEventListener('click', () => showMenu(it));
    list.appendChild(row);
  }
}
function clearSearch(){ searchText = ''; $('search').value = ''; }
$('search').addEventListener('input', e => { searchText = e.target.value; render(); });

function openItem(it){
  if (it.is_folder) { currentFolder = it.id; clearSearch(); render(); window.scrollTo(0, 0); return; }
  if (canPreview(it)) window.open(dlUrl(it, true), '_blank', 'noopener');
  else download(it);
}
function download(it){
  const a = document.createElement('a'); a.href = dlUrl(it, false); a.download = it.name;
  document.body.appendChild(a); a.click(); a.remove();
}

// ── 메뉴 / 대화상자 ──
function closeSheet(){ $('overlay').classList.remove('show'); }
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeSheet(); });
function openSheet(html){ $('sheet').innerHTML = html; $('overlay').classList.add('show'); return $('sheet'); }

function showMenu(it){
  const mine = me && it.uploaded_by === me.id;
  const here = canEditIn(it.parent_id || null);   // 이 항목이 들어 있는 폴더에서 '전체' 권한이 있어야 바꿀 수 있음
  const canRename = here && !me.readOnly && (me.isAdmin || mine);
  const canDelete = here && !me.readOnly && (it.is_folder ? me.isAdmin : (me.isAdmin || mine));
  const canMove = canDelete;
  const canAcl = it.is_folder && me.isAdmin && aclEnabled;
  const sheet = openSheet(`<h3>${iconFor(it)} ${it.restricted ? '🔒 ' : ''}${escapeHtml(it.name)}</h3>
    ${it.is_folder ? '<button class="sheet-btn" data-act="open">📂 열기</button>' : '<button class="sheet-btn" data-act="download">⬇ 내려받기</button>'}
    ${canAcl ? '<button class="sheet-btn" data-act="acl">🔒 접근 권한 (부서·직원 지정)</button>' : ''}
    ${!it.is_folder && canPreview(it) ? '<button class="sheet-btn" data-act="preview">👁 바로 보기</button>' : ''}
    ${canMove ? '<button class="sheet-btn" data-act="move">📂 다른 폴더로 이동</button>' : ''}
    ${canRename ? '<button class="sheet-btn" data-act="rename">✏ 이름 바꾸기</button>' : ''}
    ${canDelete ? '<button class="sheet-btn danger" data-act="delete">🗑 ' + (trashEnabled ? '휴지통으로 보내기' : '삭제') + '</button>' : ''}
    <div class="row"><button data-act="close">닫기</button></div>`);
  sheet.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const act = b.dataset.act; closeSheet();
    if (act === 'open') openItem(it);
    if (act === 'download') download(it);
    if (act === 'preview') window.open(dlUrl(it, true), '_blank', 'noopener');
    if (act === 'rename') askName('이름 바꾸기', it.name, async (name) => { await api('/api/rename', { method:'POST', body: JSON.stringify({ id: it.id, name }) }); toast('이름을 바꿨습니다'); await refresh(); });
    if (act === 'move') askMove(it);
    if (act === 'delete') askDelete(it);
    if (act === 'acl') askAcl(it);
  }));
}

  openSheet(`<h3>🔒 「${escapeHtml(it.name)}」 접근 권한</h3><p style="color:var(--muted);">직원 목록을 불러오는 중…</p>`);

    <div id="acl-box" style="${acl.restricted ? '' : 'display:none;'}">

function askName(title, initial, onOk){
  const sheet = openSheet(`<h3>${escapeHtml(title)}</h3><input type="text" id="name-input" maxlength="200">
    <div class="row"><button data-act="cancel">취소</button><button class="btn-primary" data-act="ok">확인</button></div>`);
  const input = sheet.querySelector('#name-input'); input.value = initial || '';
  setTimeout(() => { input.focus(); const dot = input.value.lastIndexOf('.'); input.setSelectionRange(0, dot > 0 ? dot : input.value.length); }, 50);
  const ok = async () => {
    const name = input.value.trim(); if (!name) { toast('이름을 입력해주세요'); return; }
    closeSheet();
    try { await onOk(name); } catch (e) { toast(e.message); }
  };
  sheet.querySelector('[data-act=ok]').addEventListener('click', ok);

}

// 이동할 폴더 고르기 (폴더 구조를 들여쓰기로 표시)
function askMove(it){
  const blocked = new Set();
  if (it.is_folder) { // 자기 자신과 그 안의 폴더로는 이동 불가
    const stack = [it.id];
    while (stack.length) { const id = stack.pop(); blocked.add(id); items.filter(x => x.is_folder && x.parent_id === id).forEach(x => stack.push(x.id)); }
  }
  const lines = [];
  (function walk(parentId, depth){
    items.filter(x => x.is_folder && (x.parent_id || null) === parentId && !blocked.has(x.id))
      .sort((a, b) => a.name.localeCompare(b.name, 'ko'))
      .forEach(f => { lines.push({ id: f.id, name: f.name, depth }); walk(f.id, depth + 1); });
  })(null, 1);
  const cur = it.parent_id || null;
  // 넣을 수 없는 폴더(읽기만)는 회색으로
  const btn = (id, label, depth) => { const no = id === cur || !canEditIn(id); return `<button class="sheet-btn" data-dest="${id || 'root'}" style="padding-left:${10 + depth * 18}px;${no ? ' color:var(--muted);' : ''}" ${no ? 'disabled' : ''}>📁 ${escapeHtml(label)}${id === cur ? ' (현재 위치)' : (!canEditIn(id) ? ' (읽기만)' : '')}</button>`; };
  const sheet = openSheet(`<h3>「${escapeHtml(it.name)}」 옮길 폴더 선택</h3>
    <div style="max-height:50vh; overflow:auto;">${btn(null, '전체 (최상위)', 0)}${lines.map(l => btn(l.id, l.name, l.depth)).join('')}</div>
    ${lines.length ? '' : '<p style="color:var(--muted);">아직 폴더가 없습니다. 「＋ 새 폴더」로 먼저 폴더를 만들어주세요.</p>'}
    <div class="row"><button data-act="cancel">취소</button></div>`);
  sheet.querySelector('[data-act=cancel]').addEventListener('click', closeSheet);
  sheet.querySelectorAll('[data-dest]').forEach(b => b.addEventListener('click', async () => {
    const dest = b.dataset.dest === 'root' ? null : b.dataset.dest;
    closeSheet();
    try { await api('/api/move', { method:'POST', body: JSON.stringify({ id: it.id, parent_id: dest }) }); toast('옮겼습니다'); await refresh(); }
    catch (e) { toast(e.message); }
  }));
}

function askDelete(it){
  const T = trashEnabled;
  const sheet = openSheet(`<h3>${T ? '휴지통으로 보낼까요?' : '삭제할까요?'}</h3>
    <p>${it.is_folder ? `폴더 「${escapeHtml(it.name)}」와 그 안의 모든 파일이 ` : `「${escapeHtml(it.name)}」 파일이 `}${T ? '휴지통으로 이동합니다.' : '삭제됩니다.'}<br>${T ? `휴지통에서 ${trashDays}일 안에는 복원할 수 있습니다.` : '삭제한 뒤에는 되돌릴 수 없습니다.'}</p>
    <div class="row"><button data-act="cancel">취소</button><button class="btn-danger" data-act="ok">${T ? '휴지통으로' : '삭제'}</button></div>`);
  sheet.querySelector('[data-act=cancel]').addEventListener('click', closeSheet);
  sheet.querySelector('[data-act=ok]').addEventListener('click', async () => {
    closeSheet();
    try { await api('/api/delete', { method:'POST', body: JSON.stringify({ id: it.id }) }); toast(T ? '휴지통으로 보냈습니다' : '삭제했습니다'); await refresh(); }
    catch (e) { toast(e.message); }
  });
}

// ── 여러 개 선택 (내려받기 · 이동 · 삭제) ──
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
function canModify(it){ // 이동·삭제 권한 (개별 ⋮ 메뉴와 같은 기준)
  const mine = me && it.uploaded_by === me.id;
  return !me.readOnly && canEditIn(it.parent_id || null) && (it.is_folder ? me.isAdmin : (me.isAdmin || mine));
}
function setSelectMode(on){
  selectMode = on; selected.clear(); lastPickIdx = -1;
  document.body.classList.toggle('selecting', on);
  $('select-btn').textContent = on ? '✕ 선택 끝내기' : '☑ 선택';
  render();
}
function updateSelBar(){
  const n = selected.size;
  $('sel-count').textContent = `${n}개 선택`;
  const allPicked = visibleRows.length > 0 && visibleRows.every(it => selected.has(it.id));
  $('sel-all').textContent = allPicked ? '전체해제' : '전체선택';
  ['sel-dl', 'sel-move', 'sel-del'].forEach(id => { $(id).disabled = n === 0; });
  const ro = !!(me && me.readOnly) || !canEditIn(currentFolder);
  $('sel-move').style.display = ro ? 'none' : ''; $('sel-del').style.display = ro ? 'none' : '';
}
function pickItem(it, idx, shift){
  if (shift && lastPickIdx >= 0 && lastPickIdx < visibleRows.length) { // Shift+클릭: 마지막으로 누른 항목까지 한꺼번에
    const on = !selected.has(it.id);
    for (let i = Math.min(idx, lastPickIdx); i <= Math.max(idx, lastPickIdx); i++) { if (on) selected.add(visibleRows[i].id); else selected.delete(visibleRows[i].id); }
  } else if (selected.has(it.id)) selected.delete(it.id); else selected.add(it.id);
  lastPickIdx = idx;
  render();
}
function selectedItems(){ return [...selected].map(id => byId.get(id)).filter(Boolean); }
// 이동·삭제 대상: 권한이 있는 항목만, 선택한 폴더 안에 있는 항목은 폴더와 함께 처리되므로 뺀다
function editTargets(){
  const all = selectedItems(), ok = all.filter(canModify), ids = new Set(ok.map(x => x.id));
  const top = ok.filter(x => {
    let p = x.parent_id ? byId.get(x.parent_id) : null, g = 0;
    while (p && g++ < 100) { if (ids.has(p.id)) return false; p = p.parent_id ? byId.get(p.parent_id) : null; }
    return true;
  });
  return { targets: top, skipped: all.length - ok.length };
}
async function runBulk(targets, fn){ // 하나씩 순서대로 처리하고 성공·실패 개수를 센다
  let done = 0, fail = 0, firstErr = '';
  for (const it of targets) {
    try { await fn(it); done++; } catch (e) { fail++; if (!firstErr) firstErr = e.message; }
  }
  return { done, fail, firstErr };
}
function bulkSummary(verb, r, skipped){
  return `${r.done}개를 ${verb}${r.fail ? ` · ${r.fail}개 실패(${r.firstErr})` : ''}${skipped ? ` · 권한 없는 ${skipped}개 제외` : ''}`;
}

const ZIP_MAX = 300 * 1024 * 1024; // 이 크기까지는 브라우저에서 ZIP으로 묶음
async function zipDownload(files){
  const zip = new JSZip(), used = new Set();
  for (const [i, f] of files.entries()) {
    toast(`ZIP으로 묶는 중… ${i + 1}/${files.length}`);
    const res = await fetch(dlUrl(f, false));
    if (!res.ok) throw new Error(`${f.name} 받기 실패 (${res.status})`);
    let name = f.name; const dot = f.name.lastIndexOf('.');
    for (let k = 2; used.has(name); k++) name = dot > 0 ? `${f.name.slice(0, dot)} (${k})${f.name.slice(dot)}` : `${f.name} (${k})`; // 같은 이름은 번호를 붙임
    used.add(name);
    zip.file(name, await res.blob());
  }
  const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
  const d = new Date(), ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `공유폴더_${ymd}_${files.length}개.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function bulkDownload(){
  const list = selectedItems(), files = list.filter(x => !x.is_folder), folders = list.length - files.length;
  if (!files.length) { toast('폴더는 내려받을 수 없습니다. 파일을 선택해주세요'); return; }
  const total = files.reduce((n, f) => n + Number(f.size || 0), 0);
  // 여러 개는 ZIP 하나로 묶어서 받는다 (브라우저가 여러 파일 동시 다운로드를 막는 경우가 많음). 너무 크면 하나씩.
  if (files.length > 1 && total <= ZIP_MAX && window.JSZip) {
    try {
      await zipDownload(files);
      toast(`파일 ${files.length}개를 ZIP 하나로 받았습니다${folders ? ` · 폴더 ${folders}개는 제외` : ''}`);
      return;
    } catch (e) { toast('묶기에 실패해 하나씩 받습니다'); await sleep(1200); }
  }
  toast(`${files.length}개 파일 내려받기를 시작합니다${files.length > 1 ? ' (하나씩 받습니다. 브라우저가 여러 파일 허용을 물으면 「허용」)' : ''}`);
  for (const f of files) { download(f); await sleep(600); }
  if (folders) toast(`파일 ${files.length}개를 받았습니다 · 폴더 ${folders}개는 제외했습니다`);
}

function askMoveMany(){
  const { targets, skipped } = editTargets();
  if (!targets.length) { toast('이동할 수 있는 항목이 없습니다 (권한 없음)'); return; }
  const blocked = new Set(); // 선택한 폴더와 그 안의 폴더로는 이동 불가
  const stack = targets.filter(x => x.is_folder).map(x => x.id);
  while (stack.length) { const id = stack.pop(); blocked.add(id); items.filter(x => x.is_folder && x.parent_id === id).forEach(x => stack.push(x.id)); }
  const lines = [];
  (function walk(parentId, depth){
    items.filter(x => x.is_folder && (x.parent_id || null) === parentId && !blocked.has(x.id))
      .sort((a, b) => a.name.localeCompare(b.name, 'ko'))
      .forEach(f => { lines.push({ id: f.id, name: f.name, depth }); walk(f.id, depth + 1); });
  })(null, 1);
  const parents = new Set(targets.map(x => x.parent_id || null));
  const cur = parents.size === 1 ? [...parents][0] : undefined; // 모두 같은 폴더에 있을 때만 「현재 위치」 표시
  const btn = (id, label, depth) => { const no = id === cur || !canEditIn(id); return `<button class="sheet-btn" data-dest="${id || 'root'}" style="padding-left:${10 + depth * 18}px;${no ? ' color:var(--muted);' : ''}" ${no ? 'disabled' : ''}>📁 ${escapeHtml(label)}${id === cur ? ' (현재 위치)' : (!canEditIn(id) ? ' (읽기만)' : '')}</button>`; };
  const sheet = openSheet(`<h3>선택한 ${targets.length}개 옮길 폴더 선택</h3>
    ${skipped ? `<p style="color:var(--muted);">권한이 없는 ${skipped}개는 제외됩니다.</p>` : ''}
    <div style="max-height:50vh; overflow:auto;">${btn(null, '전체 (최상위)', 0)}${lines.map(l => btn(l.id, l.name, l.depth)).join('')}</div>
    ${lines.length ? '' : '<p style="color:var(--muted);">아직 폴더가 없습니다. 「＋ 새 폴더」로 먼저 폴더를 만들어주세요.</p>'}
    <div class="row"><button data-act="cancel">취소</button></div>`);
  sheet.querySelector('[data-act=cancel]').addEventListener('click', closeSheet);
  sheet.querySelectorAll('[data-dest]').forEach(b => b.addEventListener('click', async () => {
    const dest = b.dataset.dest === 'root' ? null : b.dataset.dest;
    closeSheet(); toast('옮기는 중…');
    const r = await runBulk(targets, it => api('/api/move', { method:'POST', body: JSON.stringify({ id: it.id, parent_id: dest }) }));
    selected.clear(); toast(bulkSummary('옮겼습니다', r, skipped));
    try { await refresh(); } catch (e) { toast(e.message); }
  }));
}

function askDeleteMany(){
  const T = trashEnabled;
  const { targets, skipped } = editTargets();
  if (!targets.length) { toast(`${T ? '휴지통으로 보낼' : '삭제할'} 수 있는 항목이 없습니다 (권한 없음)`); return; }
  const nFolder = targets.filter(x => x.is_folder).length, nFile = targets.length - nFolder;
  const what = [nFile ? `파일 ${nFile}개` : '', nFolder ? `폴더 ${nFolder}개(안의 모든 파일 포함)` : ''].filter(Boolean).join(', ');
  const sheet = openSheet(`<h3>${targets.length}개를 ${T ? '휴지통으로 보낼까요?' : '삭제할까요?'}</h3>
    <p>${what}가 ${T ? '휴지통으로 이동합니다.' : '삭제됩니다.'}${skipped ? `<br>권한이 없는 ${skipped}개는 제외됩니다.` : ''}<br>${T ? `휴지통에서 ${trashDays}일 안에는 복원할 수 있습니다.` : '삭제한 뒤에는 되돌릴 수 없습니다.'}</p>
    <div class="row"><button data-act="cancel">취소</button><button class="btn-danger" data-act="ok">${T ? '휴지통으로' : '삭제'}</button></div>`);
  sheet.querySelector('[data-act=cancel]').addEventListener('click', closeSheet);
  sheet.querySelector('[data-act=ok]').addEventListener('click', async () => {
    closeSheet(); toast(T ? '휴지통으로 보내는 중…' : '삭제하는 중…');
    const r = await runBulk(targets, it => api('/api/delete', { method:'POST', body: JSON.stringify({ id: it.id }) }));
    selected.clear(); toast(bulkSummary(T ? '휴지통으로 보냈습니다' : '삭제했습니다', r, skipped));
    try { await refresh(); } catch (e) { toast(e.message); }
  });
}

// ── 휴지통 ──
function confirmClick(btn, label, fn){ // 버튼을 한 번 누르면 문구가 바뀌고, 3초 안에 한 번 더 누르면 실행
  let armed = false, timer = null; const orig = btn.textContent;
  btn.addEventListener('click', () => {
    if (!armed) { armed = true; btn.textContent = label; timer = setTimeout(() => { armed = false; btn.textContent = orig; }, 3000); }
    else { clearTimeout(timer); armed = false; btn.textContent = orig; fn(); }
  });
}
async function openTrash(){
  openSheet('<h3>🗑 휴지통</h3><p style="color:var(--muted);">불러오는 중…</p>');
  let data;
  try { data = await api('/api/trash'); } catch (e) { closeSheet(); toast(e.message); return; }
  renderTrash(data);
}
function renderTrash(data){
  const days = data.days || trashDays, now = Date.now();
  const rows = data.items.map(t => {
    const left = Math.max(0, Math.ceil(days - (now - new Date(t.deleted_at).getTime()) / 86400000));
    const meta = `${t.is_folder ? `폴더 · 파일 ${t.files}개 · ` : ''}${fmtSize(t.size)} · ${escapeHtml(t.deleted_by_name || '')} ${fmtDate(t.deleted_at)} 삭제 · <b>${left}일 뒤 완전 삭제</b>`;
    return `<div class="trash-row" data-id="${t.id}">
      <div class="icon">${iconFor({ name: t.name, mime: '', is_folder: t.is_folder })}</div>
      <div class="main"><div class="name">${escapeHtml(t.name)}</div><div class="meta">${meta}</div><div class="meta">원래 위치: ${escapeHtml(t.orig_path)}</div></div>
      <div class="acts"><button data-act="restore">복원</button><button class="btn-danger" data-act="purge">완전삭제</button></div>
    </div>`;
  }).join('');
  const sheet = openSheet(`<h3>🗑 휴지통</h3>
    <p style="color:var(--muted);font-size:13px;">삭제한 항목은 ${days}일 동안 보관된 뒤 자동으로 완전히 삭제됩니다. 관리자는 모든 항목, 그 외에는 내가 올린 파일만 보입니다.</p>
    <div class="trash-list">${rows || '<div class="empty">휴지통이 비어 있습니다.</div>'}</div>
    <div class="row">${data.items.length ? '<button class="btn-danger" data-act="empty">휴지통 비우기</button>' : ''}<button data-act="close">닫기</button></div>`);
  sheet.querySelector('[data-act=close]').addEventListener('click', closeSheet);
  const reload = async () => { try { await refresh(); } catch (e) { toast(e.message); } openTrash(); };
  const purge = (id) => api('/api/trash/purge', { method:'POST', body: JSON.stringify({ id }) });
  sheet.querySelectorAll('.trash-row').forEach(row => {
    const id = row.dataset.id;
    row.querySelector('[data-act=restore]').addEventListener('click', async () => {
      try {
        const r = await api('/api/restore', { method:'POST', body: JSON.stringify({ id }) });
        toast(r.movedToRoot ? '복원했습니다 (원래 폴더가 없어 「전체」에 복원)' : '복원했습니다'); await reload();
      } catch (e) { toast(e.message); }
    });
    confirmClick(row.querySelector('[data-act=purge]'), '정말 삭제', async () => {
      try { await purge(id); toast('완전히 삭제했습니다'); await reload(); } catch (e) { toast(e.message); }
    });
  });
  const emptyBtn = sheet.querySelector('[data-act=empty]');
  if (emptyBtn) confirmClick(emptyBtn, '정말 비우기', async () => {
    toast('비우는 중…');
    const r = await runBulk(data.items, t => purge(t.id));
    toast(bulkSummary('완전히 삭제했습니다', r, 0)); await reload();
  });
}
$('trash-btn').addEventListener('click', openTrash);

$('select-btn').addEventListener('click', () => setSelectMode(!selectMode));
$('sel-done').addEventListener('click', () => setSelectMode(false));
$('sel-all').addEventListener('click', () => {
  const allPicked = visibleRows.length > 0 && visibleRows.every(it => selected.has(it.id));
  visibleRows.forEach(it => { if (allPicked) selected.delete(it.id); else selected.add(it.id); });
  render();
});
$('sel-dl').addEventListener('click', bulkDownload);
$('sel-move').addEventListener('click', askMoveMany);
$('sel-del').addEventListener('click', askDeleteMany);

$('folder-btn').addEventListener('click', () => {
  askName('새 폴더 이름', '', async (name) => {
    await api('/api/folder', { method:'POST', body: JSON.stringify({ parent_id: currentFolder, name }) });
    toast('폴더를 만들었습니다'); await refresh();
  });
});

// ── 업로드 ──
$('upload-btn').addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', e => { const files = [...e.target.files]; e.target.value = ''; uploadFiles(files); });

let dragDepth = 0;
window.addEventListener('dragenter', e => { if (e.dataTransfer?.types?.includes('Files')) { dragDepth++; document.body.classList.add('dragging'); e.preventDefault(); } });
window.addEventListener('dragover', e => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
window.addEventListener('drop', e => {
  if (!e.dataTransfer?.files?.length) return;
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  if (!token || !me) return;
  if (me.readOnly) { toast('읽기 전용 권한이라 파일을 올릴 수 없습니다'); return; }
  if (!canEditIn(currentFolder)) { toast('이 폴더는 읽기만 할 수 있어 파일을 올릴 수 없습니다'); return; }
  uploadFiles([...e.dataTransfer.files]);
});

let activeUploads = 0;
window.addEventListener('beforeunload', e => { if (activeUploads > 0) { e.preventDefault(); e.returnValue = ''; } });

function xhrSend(method, path, body, onProgress){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open(method, WORKER_URL + path);
    xhr.setRequestHeader('Authorization', `Bearer ${token}`);
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded); };
    xhr.onload = () => {
      let data = {}; try { data = JSON.parse(xhr.responseText); } catch(e){}
      if (xhr.status >= 200 && xhr.status < 300) resolve(data);
      else { const err = new Error(data.error || `업로드 실패 (${xhr.status})`); err.status = xhr.status; reject(err); }
    };
    xhr.onerror = () => reject(new Error('연결이 끊겼습니다'));
    xhr.send(body);
  });
}

async function sendWithRetry(method, path, body, onProgress){
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    try { return await xhrSend(method, path, body, onProgress); }
    catch (e) { lastErr = e; if (e.status && e.status < 500) throw e; await new Promise(r => setTimeout(r, 1500 * (attempt + 1))); }
  }
  throw lastErr;
}

async function uploadOne(file, parentId, onProgress){
  const type = file.type || 'application/octet-stream';
  if (file.size <= SINGLE_MAX) {
    const qs = `?parent=${parentId || 'root'}&name=${encodeURIComponent(file.name)}&type=${encodeURIComponent(type)}`;
    return xhrSend('PUT', '/api/upload' + qs, file, onProgress);
  }
  const { key, uploadId } = await api('/api/mpu/create', { method:'POST', body: JSON.stringify({ parent_id: parentId, name: file.name, type, size: file.size }) });
  try {
    const parts = []; const total = Math.ceil(file.size / PART_SIZE);
    for (let i = 0; i < total; i++) {
      const start = i * PART_SIZE;
      const chunk = file.slice(start, Math.min(file.size, start + PART_SIZE));
      const qs = `?key=${encodeURIComponent(key)}&uploadId=${encodeURIComponent(uploadId)}&part=${i + 1}`;
      parts.push(await sendWithRetry('PUT', '/api/mpu/part' + qs, chunk, loaded => onProgress(start + loaded)));
    }
    return await api('/api/mpu/complete', { method:'POST', body: JSON.stringify({ key, uploadId, parts, parent_id: parentId, name: file.name, type }) });
  } catch (e) {
    api('/api/mpu/abort', { method:'POST', body: JSON.stringify({ key, uploadId }) }).catch(() => {});
    throw e;
  }
}

async function uploadFiles(files){
  if (!files.length) return;
  const parentId = currentFolder;
  const box = $('uploads'); box.style.display = 'block';
  const rows = files.map(f => {
    const row = document.createElement('div'); row.className = 'up-row';
    row.innerHTML = `<div class="up-name"><span>${escapeHtml(f.name)}</span><span class="up-state">대기 중</span></div><div class="bar"><div></div></div>`;
    box.appendChild(row); return row;
  });
  let okCount = 0, failCount = 0;
  activeUploads++;
  try {
    for (let i = 0; i < files.length; i++) {
      const f = files[i], row = rows[i];
      const state = row.querySelector('.up-state'), bar = row.querySelector('.bar > div');
      try {
        await uploadOne(f, parentId, loaded => {
          const pct = f.size ? Math.min(100, loaded / f.size * 100) : 100;
          bar.style.width = pct + '%'; state.textContent = pct.toFixed(0) + '%';
        });
        bar.style.width = '100%'; state.textContent = '완료'; okCount++;
        setTimeout(() => row.remove(), 2500);
      } catch (e) {
        row.classList.add('error'); bar.style.width = '100%'; state.textContent = '실패: ' + e.message; failCount++;
        setTimeout(() => row.remove(), 9000);
      }
    }
  } finally { activeUploads--; }
  toast(failCount ? `${okCount}개 완료, ${failCount}개 실패` : `${okCount}개 파일을 올렸습니다`);
  setTimeout(() => { if (!box.children.length) box.style.display = 'none'; }, 9500);
  try { await refresh(); } catch (e) {}
}

// ── 시작 ──
async function start(){
  try {
    await refresh();
    $('login-screen').style.display = 'none';
    $('app').style.display = 'block';
  } catch (e) {
    if (e.status === 403) { token = null; showLogin(e.message); }
    else if ($('login-screen').style.display === 'none') { $('app').style.display = 'block'; $('list').innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`; }
    else showLogin(e.message);
  }
}
(function init(){
  try { token = localStorage.getItem('auth_token'); } catch (e) { token = null; }
  if (token) start(); else showLogin();
})();
</script>
